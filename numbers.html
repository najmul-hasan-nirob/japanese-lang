---
layout: default
title: Japanese Numbers · 1–10,000
css: /css/numbers.css
js: 
  - /js/main.js
  - /js/speech-fix.js
  - /js/numbers.js
---

<div class="toolbar">

    <div class="field filter-field">
        <label for="range">Range</label>
        <select id="range">
            <option value="all">All</option>
            <option value="1-100" selected>Range</option>
            <option value="101-1000">101 – 1,000</option>
            <option value="thousands">Thousands</option>
        </select>
    </div>

    <div class="field filter-field">
        <label for="mode">Order</label>
        <select id="mode">
            <option value="normal">Order</option>
            <option value="shuffle">Shuffle</option>
        </select>
    </div>

    <div class="field direction-filter-field">
        <label>Front / Back</label>
        <div class="abacus" id="direction" role="button" tabindex="0" aria-pressed="false" aria-label="Show reading or number first">
            <span class="abacus-label left active">reading</span>
            <div class="rod"><div class="bead"></div></div>
            <span class="abacus-label right">123</span>
        </div>
    </div>

    <div class="field shuffle-field">
        <label>Shuffle</label>
        <button id="shuffleBtn" class="shuffle-btn" type="button">Shuffle</button>
    </div>
</div>

<div class="under-toolbar">
    <div class="logic">
        <h2>সুত্রঃ</h2>
    </div>
    <div class="count-display" id="countDisplay" aria-live="polite"></div>
</div>
<div class="grid" id="grid"></div>

<div class="footnote"><span class="dot"></span>marked cards are round-number milestones (hundreds &amp; thousands)</div>

<style>
@media (max-width:520px){.grid{grid-template-columns:repeat(3,1fr);}}
</style>

<script>
(function(){
    const grid=document.getElementById('grid');
    const count=document.getElementById('countDisplay');
    function updateCount(){
        const total=grid.querySelectorAll(':scope > .card').length;
        count.textContent=`Showing ${total} ${total===1 ? 'number' : 'numbers'}`;
    }
    updateCount();
    new MutationObserver(updateCount).observe(grid,{childList:true});
})();
</script>
