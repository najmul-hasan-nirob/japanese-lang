<textarea id="text">আমি বাংলায় কথা বলছি। তুমি কেমন আছো?</textarea>

<button id="speak">Speak Bangla</button>

<script>
document.getElementById('speak').onclick = function () {

    const text = document.getElementById('text').value;

    speechSynthesis.cancel();
    speechSynthesis.resume();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = 'bn-BD';
    utterance.rate = 0.95;
    utterance.pitch = 1;
    utterance.volume = 1;

    utterance.onstart = () =>
        console.log('Bangla started');

    utterance.onend = () =>
        console.log('Bangla finished');

    utterance.onerror = e =>
        console.error('Bangla error:', e.error);

    speechSynthesis.speak(utterance);
};
</script>
