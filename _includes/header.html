<style>
.page-head{position:sticky;top:0;z-index:1000;background:var(--paper);padding-top:0;padding-bottom:12px;display:flex;align-items:center;}
body{padding-top:0 !important;}
@media (max-width:520px){
  .page-head{padding-top:5px;padding-bottom:10px;padding-left:10px;}
  body{padding-top:0 !important;}
  body.mobile-menu-open{overflow:hidden !important;overscroll-behavior:none;touch-action:none;}
  .main-nav .mobile-menu-filter:nth-of-type(n){min-width:0;}
  .main-nav .mobile-menu-filter-0,.main-nav .mobile-menu-filter-1{width:calc(50% - 4px)!important;flex:0 0 calc(50% - 4px)!important;box-sizing:border-box;grid-column:auto!important;grid-column-start:auto!important;grid-column-end:auto!important;}
  .main-nav .mobile-menu-filter-0 select,.main-nav .mobile-menu-filter-1 select{width:100%;}
  .main-nav .mobile-menu-filter-0 + .mobile-menu-filter-1{margin-left:0;}

  /* Full-screen mobile hamburger overlay. The page is locked underneath and
     this independent section owns all scrolling while the menu is open. */
  body.mobile-menu-open #mobileMenuArea{
    position:fixed;
    inset:0;
    width:100vw;
    height:100dvh;
    max-height:none;
    margin:0;
    padding:76px 14px 28px;
    box-sizing:border-box;
    background:var(--paper);
    color:var(--ink);
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-y;
    overscroll-behavior:contain;
    scrollbar-width:thin;
    z-index:10001;
  }
  body.mobile-menu-open #mobileMenuArea .main-nav{
    width:100%;
    min-height:calc(100dvh - 104px);
    box-sizing:border-box;
    padding-bottom:24px;
  }
  body.mobile-menu-open #mobileMenuArea::-webkit-scrollbar{width:5px;}
  body.mobile-menu-open #mobileMenuArea::-webkit-scrollbar-thumb{background:var(--paper-line,#3a3a3a);border-radius:10px;}
  body.mobile-menu-open #mobileMenuArea::-webkit-scrollbar-track{background:transparent;}

  /* Keep the hamburger/close button above the full-screen overlay. */
  #mobileMenuToggle{
    position:relative;
    z-index:10003;
  }
  body.mobile-menu-open #mobileMenuToggle{
    position:fixed;
    top:10px;
    right:10px;
    z-index:10004;
  }
  body.mobile-menu-open .logo{
    position:relative;
    z-index:10004;
  }
  body.mobile-menu-open .page-head{
    z-index:10003;
  }
}
.logo{display:flex;gap:15px;align-items:center;text-decoration:none;color:inherit;}
.logo h1{color:var(--ink);}
</style>

<div class="page-head">
    <a href="{{ '/' | relative_url }}" class="logo" aria-label="Japanese Learning home">
        <div class="kanji-mark">あ数</div>
        <h1>Japanese Learning</h1>
    </a>
    <button class="mobile-menu-toggle" id="mobileMenuToggle" type="button" aria-expanded="false" aria-label="Open menu"><span></span><span></span><span></span></button>
    <div class="nav" id="mobileMenuArea">
        <nav class="main-nav">
            <a href="{{ '/index.html' | relative_url }}">あ Kana</a>
            <a href="{{ '/numbers.html' | relative_url }}">数 Numbers</a>
            <a href="{{ '/lessons.html' | relative_url }}">📖 Lessons</a>
            <a href="{{ '/practice.html' | relative_url }}">🧠 Practice</a>
            <button id="theme">🌙 Dark</button>
            <div class="abacus" id="direction" role="button" tabindex="0" aria-pressed="false" aria-label="Show all cards front or back">
                <span class="abacus-label left active" id="directionLeftLabel">Front</span><div class="rod"><div class="bead" id="bead"></div></div><span class="abacus-label right" id="directionRightLabel">Back</span>
            </div>
        </nav>
    </div>
</div>
<script>
(function(){
function initMobileMenu(){
 const toggle=document.getElementById('mobileMenuToggle'),nav=document.getElementById('mobileMenuArea'),toolbar=document.querySelector('.toolbar');
 if(!toggle||!nav)return;
 const mainNav=nav.querySelector('.main-nav'),direction=document.getElementById('direction');
 let bottom=document.querySelector('.mobile-bottom-controls'),filters=[],filterMarks=[],directionMark=null,shuffleMark=null,romajiMark=null,moved=false;
 if(!bottom){bottom=document.createElement('div');bottom.className='mobile-bottom-controls';document.body.appendChild(bottom);}
 function move(){
  if(moved||innerWidth>520)return;
  if(toolbar){
   filters=Array.from(toolbar.querySelectorAll(':scope > .field')).filter(f=>!f.querySelector('#shuffleBtn')&&!f.querySelector('#backRomajiToggle'));
   filters.forEach((f,i)=>{const m=document.createComment('desktop-filter-position');f.before(m);f.classList.add('mobile-menu-filter','mobile-menu-filter-'+i);mainNav.appendChild(f);filterMarks.push(m);});
   const shuffle=document.getElementById('shuffleBtn');
   if(shuffle&&shuffle.parentNode!==bottom){shuffleMark=document.createComment('desktop-shuffle-position');shuffle.before(shuffleMark);bottom.appendChild(shuffle);}
  }
  const romaji=document.getElementById('backRomajiToggle');
  if(romaji&&romaji.parentNode!==bottom){romajiMark=document.createComment('desktop-romaji-position');romaji.before(romajiMark);bottom.appendChild(romaji);}
  if(direction&&direction.parentNode!==bottom){directionMark=document.createComment('desktop-direction-position');direction.before(directionMark);direction.classList.add('mobile-bottom-direction');bottom.appendChild(direction);}
  if(bottom.parentNode!==document.body)document.body.appendChild(bottom);
  moved=true;
 }
 function restore(){
  if(!moved)return;
  filters.forEach((f,i)=>{f.classList.remove('mobile-menu-filter','mobile-menu-filter-'+i);const m=filterMarks[i];if(m&&m.parentNode)m.after(f);});filterMarks.forEach(m=>m.remove());filters=[];filterMarks=[];
  const shuffle=document.getElementById('shuffleBtn');if(shuffle&&shuffleMark&&shuffleMark.parentNode){shuffle.remove();shuffleMark.after(shuffle);}if(shuffleMark){shuffleMark.remove();shuffleMark=null;}
  const romaji=document.getElementById('backRomajiToggle');if(romaji&&romajiMark&&romajiMark.parentNode){romaji.remove();romajiMark.after(romaji);}if(romajiMark){romajiMark.remove();romajiMark=null;}
  if(direction&&directionMark&&directionMark.parentNode){direction.remove();direction.classList.remove('mobile-bottom-direction');directionMark.after(direction);}if(directionMark){directionMark.remove();directionMark=null;}
  moved=false;
 }
 function sync(){innerWidth<=520?move():restore();}
 function close(){document.body.classList.remove('mobile-menu-open');toggle.classList.remove('open');toggle.setAttribute('aria-expanded','false');}
 sync();
 toggle.addEventListener('click',e=>{e.stopPropagation();sync();const open=document.body.classList.toggle('mobile-menu-open');toggle.classList.toggle('open',open);toggle.setAttribute('aria-expanded',String(open));});
 nav.addEventListener('click',e=>{if(innerWidth<=520&&e.target.closest('a'))close();});
 document.addEventListener('click',e=>{if(innerWidth<=520&&!e.target.closest('.page-head'))close();});
 addEventListener('resize',()=>{sync();if(innerWidth>520)close();});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initMobileMenu);else initMobileMenu();
})();
</script>
