<div class="page-head">
    <div class="logo">
        <div class="kanji-mark">あ数</div>
        <h1>Japanese Learning</h1>
    </div>

    <button class="mobile-menu-toggle" id="mobileMenuToggle" type="button" aria-expanded="false" aria-label="Open menu">
        <span></span><span></span><span></span>
    </button>

    <div class="nav" id="mobileMenuArea">
        <nav class="main-nav">
            <a href="{{ '/index.html' | relative_url }}">あ Kana</a>
            <a href="{{ '/numbers.html' | relative_url }}">数 Numbers</a>
            <a href="{{ '/lessons.html' | relative_url }}">📖 Lessons</a>
            <button id="theme">🌙 Dark</button>
            <div class="abacus" id="direction" role="button" tabindex="0" aria-pressed="false" aria-label="Show all cards front or back">
                <span class="abacus-label left active" id="directionLeftLabel">Front</span>
                <div class="rod"><div class="bead" id="bead"></div></div>
                <span class="abacus-label right" id="directionRightLabel">Back</span>
            </div>
        </nav>
    </div>
</div>

<script>
(function(){
    function initMobileMenu(){
        const toggle=document.getElementById('mobileMenuToggle');
        const nav=document.getElementById('mobileMenuArea');
        const toolbar=document.querySelector('.toolbar');
        if(!toggle||!nav)return;

        const mainNav=nav.querySelector('.main-nav');
        const direction=document.getElementById('direction');
        const bottomControls=document.querySelector('.mobile-bottom-controls');
        let filters=[];
        let placeholders=[];
        let directionPlaceholder=null;
        let moved=false;

        function moveFilters(){
            if(moved || window.innerWidth>520 || !toolbar || !mainNav)return;

            // Move every normal filter field from the page toolbar into
            // the mobile hamburger menu. Lessons already uses this same
            // mechanism; Kana and Numbers now use it too.
            filters=Array.from(toolbar.querySelectorAll(':scope > .field:not(.mobile-bottom-control-field)'));
            if(!filters.length)return;

            filters.forEach(field=>{
                const marker=document.createComment('desktop-filter-position');
                field.parentNode.insertBefore(marker,field);
                placeholders.push(marker);
                field.classList.add('mobile-menu-filter');
                mainNav.appendChild(field);
            });

            // Keep the shared Front/Back switch in the mobile sticky bar.
            if(direction && bottomControls && direction.parentNode !== bottomControls){
                directionPlaceholder=document.createComment('desktop-direction-position');
                mainNav.insertBefore(directionPlaceholder,direction);
                direction.classList.add('mobile-bottom-direction');
                bottomControls.appendChild(direction);
            }

            moved=true;
        }

        function restoreFilters(){
            if(!moved)return;

            filters.forEach((field,i)=>{
                field.classList.remove('mobile-menu-filter');
                const marker=placeholders[i];
                if(marker && marker.parentNode) marker.parentNode.insertBefore(field,marker.nextSibling);
            });
            placeholders.forEach(marker=>marker.remove());
            placeholders=[];
            filters=[];

            if(direction && directionPlaceholder){
                direction.classList.remove('mobile-bottom-direction');
                directionPlaceholder.parentNode.insertBefore(direction,directionPlaceholder);
                directionPlaceholder.remove();
                directionPlaceholder=null;
            }
            moved=false;
        }

        function sync(){
            if(window.innerWidth<=520) moveFilters();
            else restoreFilters();
        }

        function close(){
            document.body.classList.remove('mobile-menu-open');
            toggle.classList.remove('open');
            toggle.setAttribute('aria-expanded','false');
        }

        sync();

        toggle.addEventListener('click',function(e){
            e.stopPropagation();
            sync();
            const open=document.body.classList.toggle('mobile-menu-open');
            toggle.classList.toggle('open',open);
            toggle.setAttribute('aria-expanded',String(open));
        });

        nav.addEventListener('click',function(e){
            if(window.innerWidth<=520 && e.target.closest('a'))close();
        });

        document.addEventListener('click',function(e){
            if(window.innerWidth<=520 && !e.target.closest('.page-head'))close();
        });

        window.addEventListener('resize',function(){
            sync();
            if(window.innerWidth>520)close();
        });
    }

    if(document.readyState==='loading'){
        document.addEventListener('DOMContentLoaded',initMobileMenu);
    }else{
        initMobileMenu();
    }
})();
</script>
