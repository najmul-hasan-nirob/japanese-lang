<div class="important-rules-page">
    <div class="important-rules-header"><h1>Important Rules</h1><p>Important Japanese rules and notes to remember.</p></div>
    <div id="importantRulesList" class="important-rules-list"></div>
</div>
<style>
.important-rules-page{max-width:1100px;margin:0 auto;padding:28px 16px 70px;color:var(--ink,#241f18)}
.important-rules-header{margin-bottom:24px}
.important-rules-header h1{margin:0 0 8px;font-family:"Shippori Mincho",serif;font-size:30px}
.important-rules-header p{margin:0;color:var(--ink-soft,#7a705e);line-height:1.6}
.important-rules-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.important-rule-card{position:relative;min-height:170px;overflow:visible}
.important-rule-card>.inner{min-height:170px;padding-top:42px!important}
.important-rule-card .front,.important-rule-card .back{padding:18px 16px 16px!important;text-align:center;display:flex;align-items:center;justify-content:center;min-height:128px;box-sizing:border-box}
.important-rule-text{width:100%;line-height:1.75;white-space:pre-wrap;word-break:break-word}
/* Keep the complete card control bar in exactly one horizontal row. */
.lesson-card-topbar{position:absolute;top:0;left:0;right:0;height:42px;z-index:50;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:1fr;align-items:center;justify-items:center;pointer-events:auto;background-color:#18212c;padding:5px;box-sizing:border-box;isolation:isolate}
.lesson-card-topbar .hard-star,.lesson-card-topbar .lesson-card-number,.lesson-card-topbar .important-rule-edit,.lesson-card-topbar .lesson-tag,.lesson-card-topbar .important-rule-delete{grid-row:1!important;margin:0!important;transform:none!important}
.lesson-card-topbar .hard-star{grid-column:1;pointer-events:auto;position:relative!important;z-index:60!important;width:30px;height:30px;padding:0;border:0;background:transparent;color:#9a9a9a;font-size:25px;line-height:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.85;transition:transform .15s ease,opacity .15s ease,color .15s ease;appearance:none;-webkit-appearance:none}
.lesson-card-topbar .hard-star:hover,.lesson-card-topbar .hard-star:focus-visible{opacity:1;transform:scale(1.08);outline:none}
.lesson-card-topbar .hard-star.active{color:#f5b301;opacity:1}
.lesson-card-topbar .lesson-card-number{grid-column:2}
.lesson-card-topbar .important-rule-edit{grid-column:3}
.lesson-card-topbar .lesson-tag{grid-column:4;margin-left:0}
.lesson-card-topbar .important-rule-delete{grid-column:5}

.important-rule-card .lesson-card-topbar .important-rule-edit:hover,.important-rule-card .lesson-card-topbar .important-rule-delete:hover{opacity:1;transform:scale(1.08)}

</style>
