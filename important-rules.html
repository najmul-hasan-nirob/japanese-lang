<div class="important-rules-page">
    <div class="important-rules-header"><h1>Important Rules</h1><p>Important Japanese rules and notes to remember.</p></div>
    <div id="importantRulesList" class="important-rules-list"></div>
</div>
<style>
.important-rules-page{max-width:900px;margin:0 auto;padding:28px 16px 70px;color:var(--ink,#241f18)}.important-rules-header{margin-bottom:24px}.important-rules-header h1{margin:0 0 8px;font-family:"Shippori Mincho",serif;font-size:30px}.important-rules-header p{margin:0;color:var(--ink-soft,#7a705e);line-height:1.6}.important-rules-list{display:flex;flex-direction:column;gap:14px}.important-rule{padding:18px 20px;border:1px solid var(--paper-line,#d9d2c3);border-radius:12px;background:var(--paper-cell,#fffdf8);box-shadow:var(--shadow,0 2px 10px rgba(0,0,0,.08));line-height:1.75;white-space:pre-wrap;word-break:break-word}.important-rules-empty{padding:20px;border:1px dashed var(--paper-line,#d9d2c3);border-radius:12px;color:var(--ink-soft,#7a705e)}
</style>
<script>
(function(){'use strict';const list=document.getElementById('importantRulesList');const rules=window.importantRules||[];if(!rules.length){list.innerHTML='<div class="important-rules-empty">No important rules added yet.</div>';return}rules.forEach(function(rule){const item=document.createElement('div');item.className='important-rule';item.textContent=rule;list.appendChild(item)})})();
</script>
