---
layout: default
title: Japanese Lessons
css: /css/lessons.css
js: 
  - /js/main.js
  - /js/lessons.js
---

<div class="toolbar">

    <div class="field">
        <label id="lessonLabel">Lesson</label>
        <button type="button" class="multiselect-btn" id="lessonBtn" aria-haspopup="true" aria-expanded="false">Lesson 1</button>
        <div class="multiselect-panel" id="lessonPanel"></div>
    </div>

    <div class="field">
        <label for="mode">Order</label>
        <select id="mode">
            <option value="normal">Normal</option>
            <option value="shuffle">Shuffle</option>
        </select>
    </div>

    <div class="field">
        <label id="typeLabel">Type</label>
        <button type="button" class="multiselect-btn" id="typeBtn" aria-haspopup="true" aria-expanded="false">All types</button>
        <div class="multiselect-panel" id="typePanel">
            <label><input type="checkbox" value="vocabulary" checked> Vocabulary</label>
            <label><input type="checkbox" value="grammar" checked> Grammar</label>
        </div>
    </div>

    <div class="field">
        <label>&nbsp;</label>
        <button id="shuffleBtn" class="shuffle-btn" type="button">🔀 Shuffle</button>
    </div>

</div>
<div class="count-display" id="countDisplay" aria-live="polite"></div>
<div class="grid" id="grid"></div>



<style>
@media (max-width:520px){
    .grid{grid-template-columns:repeat(2,1fr);}
}

.count-display{
    max-width:980px;
    margin:22px auto 0;
    text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:.04em;
}
</style>

<script src="{{ '/js/lesson-filter.js' | relative_url }}"></script>

<script>
(function(){
    const grid=document.getElementById('grid');
    const count=document.getElementById('countDisplay');

    function updateCount(){
        const total=grid.querySelectorAll(':scope > .card').length;
        count.textContent=`Showing ${total} ${total===1 ? 'card' : 'cards'}`;
    }

    updateCount();
    new MutationObserver(updateCount).observe(grid,{childList:true});
})();
</script>
