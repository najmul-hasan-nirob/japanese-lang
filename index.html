---
layout: default
title: Japanese Kana
css: /css/home.css
js:
  - /js/main.js
  - /js/speech-fix.js
  - /js/home.js
---

<div class="toolbar">

    <div class="field filter-field">
        <label id="scriptLabel">Script</label>
        <button type="button" class="multiselect-btn" id="scriptBtn" aria-haspopup="true" aria-expanded="false">Script</button>
        <div class="multiselect-panel" id="scriptPanel">
            <label><input type="checkbox" value="hiragana" checked> あ Hiragana</label>
            <label><input type="checkbox" value="katakana" checked> ア Katakana</label>
        </div>
    </div>

    <div class="field filter-field">
        <label for="mode">Order</label>
        <select id="mode">
            <option value="normal">Order</option>
            <option value="shuffle">Shuffle</option>
        </select>
    </div>

    <div class="field filter-field">
        <label id="typeLabel">Type</label>
        <button type="button" class="multiselect-btn" id="typeBtn" aria-haspopup="true" aria-expanded="false">Type</button>
        <div class="multiselect-panel" id="typePanel">
            <label><input type="checkbox" value="basic" checked> Basic</label>
            <label><input type="checkbox" value="dakuten" checked> Dakuten (Porobortito)</label>
            <label><input type="checkbox" value="handakuten" checked> Handakuten (Porobortito)</label>
            <label><input type="checkbox" value="yoon" checked> Yōon (Songjukto)</label>
        </div>
    </div>

    <div class="field direction-field">
        <label>Front / Back</label>
        <button id="direction" class="direction-toggle" type="button" aria-pressed="false" aria-label="Show all cards Back" title="Show Back">
            <span class="direction-compat left active" aria-hidden="true">Kana</span>
            <span class="direction-compat right" aria-hidden="true">Romaji</span>
            <span class="lesson-control-text">Front / Back</span>
            <svg class="lesson-control-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h15l-3-3M20 17H5l3 3M19 7l-3-3M5 17l3 3"></path></svg>
        </button>
    </div>

    <div class="field shuffle-field">
        <label>Shuffle</label>
        <button id="shuffleBtn" class="shuffle-btn" type="button">Shuffle</button>
    </div>

</div>
<div class="under-toolbar">
    <div class="logic">
        <h2>সুত্রঃ আকা ছাতায় নাহা মাইয়ারা ওয়ান</h2>
    </div>
    <div class="count-display" id="countDisplay" aria-live="polite"></div>
</div>
<div class="grid" id="grid"></div>

<script>
(function(){
    const grid=document.getElementById('grid');
    const count=document.getElementById('countDisplay');
    function updateCount(){
        const total=grid.querySelectorAll(':scope > .card').length;
        count.textContent=`Showing ${total} ${total===1 ? 'kana' : 'kana'}`;
    }
    updateCount();
    new MutationObserver(updateCount).observe(grid,{childList:true});
})();
</script>
